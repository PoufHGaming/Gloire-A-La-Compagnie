<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gloire à la Compagnie — Page déplacée</title>
  <link rel="icon" type="image/png" href="../images/profil.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #c9a84c;
      --gold-dim: #8a6f30;
      --gold-light: #e8c96a;
      --bg: #0a0a0e;
      --bg2: #11111a;
      --border: rgba(201,168,76,0.22);
      --border-bright: rgba(201,168,76,0.55);
      --text: #f5f0e8;
      --text-dim: #c8bfa8;
      --text-muted: #6b5f45;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Crimson Pro', Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Fond avec légère texture de particules */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(201,168,76,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 40% 60% at 80% 80%, rgba(201,168,76,0.04) 0%, transparent 60%);
      pointer-events: none;
    }

    .card {
      position: relative;
      background: var(--bg2);
      border: 1px solid var(--border-bright);
      border-radius: 8px;
      max-width: 560px;
      width: 100%;
      padding: 48px 44px 40px;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(201,168,76,0.08),
        0 0 60px rgba(201,168,76,0.1),
        0 24px 64px rgba(0,0,0,0.6);
    }

    /* Ligne dorée en haut */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim) 20%, var(--gold) 50%, var(--gold-dim) 80%, transparent);
    }

    .icon {
      font-size: 36px;
      margin-bottom: 20px;
      opacity: 0.85;
    }

    .title {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold-dim);
      margin-bottom: 16px;
    }

    .message {
      font-size: 22px;
      color: var(--text);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .message span[data-en] { display: none; }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 700;
      padding: 14px 32px;
      background: rgba(201,168,76,0.1);
      border: 1px solid var(--border-bright);
      border-radius: 4px;
      color: var(--gold-light);
      text-decoration: none;
      transition: all 0.25s;
      box-shadow: 0 0 24px rgba(201,168,76,0.1);
      animation: pulse-border 3s ease-in-out infinite;
    }

    .cta:hover {
      background: rgba(201,168,76,0.2);
      box-shadow: 0 0 40px rgba(201,168,76,0.25);
      transform: translateY(-2px);
    }

    .cta svg {
      width: 15px; height: 15px;
      flex-shrink: 0;
      transition: transform 0.25s;
    }
    .cta:hover svg { transform: translateX(3px); }

    @keyframes pulse-border {
      0%,100% { box-shadow: 0 0 24px rgba(201,168,76,0.1); }
      50%      { box-shadow: 0 0 40px rgba(201,168,76,0.22); }
    }

    .lang-toggle {
      display: flex;
      gap: 0;
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin: 0 auto 28px;
      width: fit-content;
    }
    .lang-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 0.12em;
      padding: 6px 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lang-btn.active {
      background: rgba(201,168,76,0.12);
      color: var(--gold-light);
    }
    .lang-btn:hover:not(.active) { color: var(--text-dim); }

    .note {
      margin-top: 24px;
      font-size: 14px;
      color: var(--text-muted);
      font-style: italic;
    }

    /* redirect auto countdown */
    .countdown {
      display: block;
      margin-top: 16px;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: center;
    }
    .countdown strong { color: var(--gold-dim); }
  </style>
</head>
<body>

  <div class="card">
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-fr" onclick="setLang('fr')">FR</button>
      <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <div class="icon">⚔️</div>
    <div class="title" id="t-label">Page déplacée</div>
    <div class="message" id="t-message">
      Cette page a été migrée vers une nouvelle adresse.<br>
      Clique ci-dessous pour y accéder.
    </div>
    <a class="cta" href="https://poufhgaming.github.io/event/index.html" id="t-cta">
      Accéder à la page
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>
    <div class="countdown" id="t-countdown">
      Redirection automatique dans <strong id="t-secs">10</strong>s
    </div>
    <div class="note" id="t-note">
      Mets la nouvelle page en favori pour ne plus passer par ici.
    </div>
  </div>

  <script>
    const STRINGS = {
      fr: {
        label:     'Page déplacée',
        message:   'Cette page a été migrée vers une nouvelle adresse.<br>Clique ci-dessous pour y accéder.',
        cta:       'Accéder à la page',
        countdown: 'Redirection automatique dans <strong id="t-secs">SECS</strong>s',
        note:      'Mets la nouvelle page en favori pour ne plus passer par ici.',
      },
      en: {
        label:     'Page moved',
        message:   'This page has been moved to a new address.<br>Click below to access it.',
        cta:       'Go to the page',
        countdown: 'Automatic redirect in <strong id="t-secs">SECS</strong>s',
        note:      'Bookmark the new page so you don\'t have to come back here.',
      }
    };

    let currentLang = localStorage.getItem('pouf_lang') || 'fr';

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('pouf_lang', lang);
      const s = STRINGS[lang];
      document.getElementById('t-label').textContent = s.label;
      document.getElementById('t-message').innerHTML = s.message;
      document.getElementById('t-cta').childNodes[0].textContent = '\n      ' + s.cta + '\n      ';
      document.getElementById('t-note').textContent = s.note;
      document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      // re-inject countdown text with current secs
      const secs = parseInt(document.getElementById('t-secs')?.textContent || '10');
      document.getElementById('t-countdown').innerHTML =
        s.countdown.replace('SECS', secs);
    }

    // Auto-redirect countdown
    let secs = 10;
    const target = 'https://poufhgaming.github.io/event/index.html';

    const tick = setInterval(() => {
      secs--;
      const el = document.getElementById('t-secs');
      if (el) el.textContent = secs;
      if (secs <= 0) {
        clearInterval(tick);
        window.location.href = target;
      }
    }, 1000);

    setLang(currentLang);
  </script>
</body>
</html>
